plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}
compileJava.options.encoding='UTF-8'
tasks.withType(JavaCompile){
    options.encoding ='UTF-8'
}
dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation group: 'org.xerial', name: 'sqlite-jdbc', version: '3.47.1.0'
    implementation 'com.j256.ormlite:ormlite-core:6.1'
    implementation 'com.j256.ormlite:ormlite-jdbc:6.1'
    implementation 'ch.qos.logback:logback-classic:1.4.11'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'org.apache.commons:commons-collections4:4.4'
    implementation 'org.jfree:jfreechart:1.5.3'
    implementation 'org.xerial:sqlite-jdbc:3.41.2'
    implementation 'org.apache.poi:poi-ooxml:5.2.3'
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0' // Убедитесь, что версия актуальна
    implementation 'org.apache.logging.log4j:log4j-api:2.20.0' // API Log4j2


}

test {
    useJUnitPlatform()
}